<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pbuddy — shop scan</title>
<style>
  :root { font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 1.25rem; background: #F6F7F9; color: #1d1d1f; }
  main { max-width: 26rem; margin: 0 auto; }
  h1 { font-size: 1.15rem; }
  .card { background: #fff; border-radius: 12px; padding: 1rem; margin: .75rem 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: .8rem; margin: .6rem 0 .2rem; color: #4a5d53; }
  input, select, button { width: 100%; box-sizing: border-box; font-size: 1.05rem; padding: .6rem; border: 1px solid #c8d4cd; border-radius: 8px; }
  input#code { letter-spacing: .4em; font-variant-numeric: tabular-nums; text-align: center; font-size: 1.5rem; }
  button { margin-top: .9rem; background: #0E1B2C; color: #fff; border: 0; font-weight: 600; padding: .9rem; font-size: 1.1rem; }
  button:disabled { opacity: .5; }
  #video { width: 100%; border-radius: 8px; display: none; }
  #result { font-weight: 600; white-space: pre-wrap; }
  .ok { color: #0d7a4f; } .err { color: #b3261e; }
  .muted { font-size: .8rem; color: #6b7d73; }
</style>
</head>
<body>
<main>
  <h1><span style="color:#0E1B2C">ParcelBuddy</span> · <span id="shopName">deposit point</span></h1>

  <div class="card">
    <video id="video" playsinline muted></video>
    <button id="scanBtn" type="button">Scan QR</button>
    <p class="muted">No camera / QR won't read? Enter the code below — it always works.</p>
  </div>

  <form class="card" id="form">
    <label for="purpose">What is happening?</label>
    <select id="purpose" required>
      <option value="deposit">Sender dropping off</option>
      <option value="collection">Traveller collecting</option>
      <option value="drop">Traveller dropping off</option>
      <option value="pickup">Recipient collecting</option>
    </select>
    <label for="shipmentId">Parcel reference</label>
    <input id="shipmentId" autocomplete="off" required>
    <label for="code">6-digit code</label>
    <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required>
    <div id="photoBlock">
      <label for="photo">Photo of the parcel (required)</label>
      <input id="photo" type="file" accept="image/*" capture="environment">
      <img id="preview" alt="" style="display:none;width:100%;border-radius:8px;margin-top:.5rem">
    </div>
    <button id="submit" type="submit">Confirm handoff</button>
  </form>

  <div class="card"><div id="result" class="muted">Ready.</div></div>

  <div class="card" id="activityCard">
    <strong>Today at your shop</strong>
    <div id="activitySummary" class="muted" style="margin:.4rem 0">Loading…</div>
    <div id="activityList"></div>
  </div>

  <p class="muted">Photos are of parcels only — never people. Refuse unsealed or oversized parcels.</p>
</main>

<script>
  // Shop identity comes from the unique link (ADR 0002): ?shop=ID&token=TOKEN
  const params = new URLSearchParams(location.search);
  const shopId = params.get("shop"), linkToken = params.get("token");
  const FN_BASE = params.get("fn") || "https://europe-west2-pbuddy-uk.cloudfunctions.net";
  if (!shopId || !linkToken) {
    // Invalid link: hide the controls entirely — no ghost buttons.
    document.querySelectorAll(".card, .muted").forEach((el) => (el.style.display = "none"));
    const msg = document.createElement("div");
    msg.className = "card err";
    msg.style.display = "block";
    msg.innerHTML = "<strong>This link isn't valid.</strong><br>Please open the exact link pbuddy sent to your shop, or contact us for a new one.";
    document.querySelector("main").appendChild(msg);
  }

  // TODO v0.2: geolocation with shopkeeper consent prompt.

  // Photo required wherever custody changes hands (matches custody.ts).
  const NEEDS_PHOTO = { deposit: true, collection: true, drop: true, pickup: false };

  /** Downscale to <=1280px JPEG so uploads work on shop wifi. */
  function toJpegBase64(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.75).split(",")[1]);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function uploadPhoto(shipmentId, purpose, file) {
    const imageBase64 = await toJpegBase64(file);
    const res = await fetch(`${FN_BASE}/uploadScanPhoto`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ shopId, linkToken, shipmentId, purpose, imageBase64 }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `photo upload failed (${res.status})`);
    return body.photoRef;
  }

  async function scanTransition(data) {
    const res = await fetch(`${FN_BASE}/scanTransition`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ data }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error?.message || `HTTP ${res.status}`);
    return body.result;
  }

  const $ = (id) => document.getElementById(id);
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const out = $("result");
    $("submit").disabled = true;
    out.className = "muted"; out.textContent = "Checking…";
    try {
      const purpose = $("purpose").value;
      const shipmentId = $("shipmentId").value.trim();
      let photoRef;
      if (NEEDS_PHOTO[purpose]) {
        const file = $("photo").files[0];
        if (!file) throw new Error("A photo of the parcel is required for this step.");
        out.textContent = "Uploading photo…";
        photoRef = await uploadPhoto(shipmentId, purpose, file);
        out.textContent = "Recording handoff…";
      }
      const r = await scanTransition({
        shipmentId,
        code: $("code").value.trim(),
        purpose,
        shopId, linkToken,
        photoRef,
      });
      out.className = "ok";
      out.textContent = `✓ Recorded: parcel is now ${r.state}`;
      $("form").reset();
      $("preview").style.display = "none";
      loadActivity();
    } catch (err) {
      out.className = "err";
      out.textContent = `✗ ${err.message}\nNothing was recorded. Check the code and try again.`;
    } finally {
      $("submit").disabled = false;
    }
  });

  const STEP_LABEL = { DEPOSITED: "Parcel in", COLLECTED: "To traveller", ARRIVED: "Parcel in (dest)", DELIVERED: "Collected" };

  async function loadActivity() {
    try {
      const res = await fetch(`${FN_BASE}/getShopActivity`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ data: { shopId, linkToken } }),
      });
      const { result } = await res.json();
      if (!result) throw new Error("no data");
      document.getElementById("shopName").textContent = result.shopName;
      $("activitySummary").textContent =
        `${result.parcelsHandled} parcel${result.parcelsHandled === 1 ? "" : "s"} handled · ` +
        `~£${(result.estimatedEarningsPence / 100).toFixed(2)} earned today (paid on delivery)`;
      $("activityList").innerHTML = result.scansToday.slice(0, 8).map((r) =>
        `<div class="muted" style="display:flex;justify-content:space-between;padding:.15rem 0">
           <span>${STEP_LABEL[r.to] ?? r.to} · ${r.shipmentId.slice(0, 6)}…</span>
           <span>${new Date(r.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
         </div>`).join("") || '<div class="muted">No scans yet today.</div>';
    } catch {
      $("activitySummary").textContent = "Couldn't load today's activity.";
    }
  }
  if (shopId && linkToken) loadActivity();

  $("photo").addEventListener("change", () => {
    const f = $("photo").files[0];
    if (!f) return;
    $("preview").src = URL.createObjectURL(f);
    $("preview").style.display = "block";
  });
  $("purpose").addEventListener("change", () => {
    $("photoBlock").style.display = NEEDS_PHOTO[$("purpose").value] ? "block" : "none";
  });

  // QR path: BarcodeDetector where available (Chrome/Android); manual entry
  // remains the universal path (ADR 0002).
  $("scanBtn").addEventListener("click", async () => {
    if (!("BarcodeDetector" in window)) {
      $("result").textContent = "QR scanning not supported on this phone — use the code entry below.";
      return;
    }
    const video = $("video");
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream; video.style.display = "block"; await video.play();
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const timer = setInterval(async () => {
      const codes = await detector.detect(video).catch(() => []);
      if (!codes.length) return;
      clearInterval(timer);
      stream.getTracks().forEach((t) => t.stop());
      video.style.display = "none";
      try {
        // QR payload: {"shipmentId":"...","code":"123456","purpose":"deposit"}
        const p = JSON.parse(codes[0].rawValue);
        $("shipmentId").value = p.shipmentId; $("code").value = p.code; $("purpose").value = p.purpose;
        $("result").textContent = "QR read — press Confirm handoff.";
      } catch {
        $("result").textContent = "Unrecognised QR — use manual entry.";
      }
    }, 300);
  });
</script>
</body>
</html>
