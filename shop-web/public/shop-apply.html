<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become a ParcelBuddy point</title>
<style>
  :root { font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; background: #F6F7F9; color: #1d1d1f; }
  .hero { background: #0E1B2C; color: #fff; padding: 2.2rem 1.25rem; text-align: center; }
  .hero .brand { font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
  .hero .chev { color: #E85D26; }
  .hero p { color: rgba(255,255,255,.75); max-width: 30rem; margin: .6rem auto 0; }
  main { max-width: 28rem; margin: -1rem auto 3rem; padding: 0 1rem; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.12); padding: 1.5rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 1rem 0 .3rem; }
  input, select { width: 100%; box-sizing: border-box; font-size: 1rem; padding: .65rem .7rem;
    border: 1px solid #c8d4cd; border-radius: 10px; }
  button { width: 100%; margin-top: 1.4rem; font-size: 1.05rem; font-weight: 700; padding: .8rem;
    background: #0E1B2C; color: #fff; border: 0; border-radius: 12px; cursor: pointer; }
  button:disabled { background: #9aa7b5; }
  .why { font-size: .9rem; color: #4a5a52; margin-top: 1.2rem; }
  .why li { margin: .35rem 0; }
  #msg { margin-top: 1rem; font-size: .95rem; }
  #msg.ok { color: #0a5c3c; } #msg.err { color: #b3261e; }
</style>
</head>
<body>
<div class="hero">
  <div class="brand">Parcel<span>Buddy</span> <span class="chev">»</span></div>
  <p>Earn from parcels at your counter. Customers drop off and collect —
     you scan, we pay per parcel handled.</p>
</div>
<main>
  <div class="card">
    <form id="f">
      <label>Shop name</label>
      <input id="name" required maxlength="120" placeholder="Euston Corner Store">
      <label>Your name</label>
      <input id="contactName" required maxlength="120" placeholder="A. Khan">
      <label>Mobile number</label>
      <input id="phone" required inputmode="tel" placeholder="+44 7911 123456">
      <label>Shop address</label>
      <input id="address" required maxlength="200" placeholder="12 Eversholt St, London NW1">
      <label>Nearest route</label>
      <select id="corridorId">
        <option value="lon-bhm">London ↔ Birmingham</option>
        <option value="lon-man">London ↔ Manchester</option>
      </select>
      <button id="go" type="submit">Apply — takes 30 seconds</button>
      <div id="msg"></div>
    </form>
    <ul class="why">
      <li>💷 Paid per parcel scanned — no fees, no minimums</li>
      <li>📱 Works on any phone — no hardware to install</li>
      <li>🕐 Seconds per parcel at the counter</li>
    </ul>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBXPnQ-a3TOlfQOquTXgrONGDGTaZ5CvOM",
  authDomain: "pbuddy-uk.firebaseapp.com",
  projectId: "pbuddy-uk",
});
const fns = firebase.app().functions("europe-west2");
const $ = (id) => document.getElementById(id);
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const msg = $("msg"); msg.className = ""; msg.textContent = "";
  $("go").disabled = true; $("go").textContent = "Sending…";
  try {
    const { data } = await fns.httpsCallable("applyShop")({
      name: $("name").value, contactName: $("contactName").value,
      phone: $("phone").value, address: $("address").value,
      corridorId: $("corridorId").value,
    });
    msg.className = "ok";
    msg.textContent = data.note ?? "Application received — we'll text you within a day or two.";
    $("go").textContent = "Applied ✓";
  } catch (err) {
    msg.className = "err"; msg.textContent = err.message;
    $("go").disabled = false; $("go").textContent = "Apply — takes 30 seconds";
  }
};
</script>
</body>
</html>
